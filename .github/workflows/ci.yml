name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      # Install CPU-only torch first so we skip the multi-GB CUDA bundle on
      # Linux runners. Windows PyPI wheels are already CPU-only, so the local
      # setup just runs `pip install -e ".[dev]"`.
      - name: Install CPU PyTorch
        run: pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest
