[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "two-tower-recs"
version = "0.1.0"
description = "Two-tower retrieval recommender: PyTorch dual-encoder, FAISS + FastAPI serving, evaluated against popularity and matrix-factorization baselines."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.13.0",
    "faiss-cpu==1.15.0",
    "numpy==2.5.1",
    "pandas==3.0.5",
    "scipy==1.18.0",
    "datasets==5.0.1",
    "sentence-transformers==5.6.1",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "wandb==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.1",
]
# ALS matrix-factorization baseline; schedule-contingent per the brief, so it
# lives behind an extra instead of the core install.
mf = [
    "implicit==0.7.3",
]

[project.urls]
Repository = "https://github.com/kevt2002/two-tower-recs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
